<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d9a8"/>
      <stop offset="45%" stop-color="#e8a8c8"/>
      <stop offset="100%" stop-color="#8b6fd6"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff7e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <circle cx="300" cy="230" r="200" fill="url(#sun)"/>
  <circle cx="300" cy="230" r="70" fill="#fffaf0" opacity="0.9"/>
  <g filter="url(#blur1)" opacity="0.9">
    <ellipse cx="120" cy="380" rx="150" ry="42" fill="#ffffff"/>
    <ellipse cx="460" cy="340" rx="170" ry="50" fill="#ffffff"/>
    <ellipse cx="300" cy="460" rx="220" ry="55" fill="#ffffff"/>
  </g>
  <g filter="url(#blur2)" opacity="0.6">
    <ellipse cx="80" cy="470" rx="180" ry="60" fill="#f4e6ff"/>
    <ellipse cx="520" cy="500" rx="200" ry="65" fill="#f4e6ff"/>
  </g>
  <rect width="600" height="600" fill="#8b5cf6" opacity="0.06"/>
</svg>
